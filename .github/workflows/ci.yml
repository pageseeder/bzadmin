name: Qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run lint && npm run format:check && npm test
        working-directory: frontend
      - run: git diff --exit-code -- overlay/src/main/resources/META-INF/resources
      - run: ./gradlew --no-daemon clean :overlay:test :test-host:hostTest :test-host:hostTestStaged check :overlay:checkDependencyBoundary
      - name: Clean Maven consumer
        run: python3 scripts/maven-consumer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
