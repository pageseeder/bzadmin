name: Qualification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run lint && npm run format:check && npm test
        working-directory: frontend
      - run: git diff --exit-code -- overlay/src/main/resources/META-INF/resources
      - run: ./gradlew --no-daemon clean :overlay:test :test-host:hostTest :test-host:hostTestStaged check :overlay:checkDependencyBoundary
      - name: Clean Maven consumer
        run: python3 scripts/maven-consumer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
  # The overlay and packaged-host tests on newer JDKs; Gradle runs on Java 11 and the code is compiled for 11
  newer-jdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last version is the default, which runs Gradle
          java-version: |
            ${{ matrix.jdk }}
            11
      - run: >-
          ./gradlew --no-daemon :overlay:test :test-host:hostTest
          -PtestJdk=${{ matrix.jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.jdk }}_X64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-jdk${{ matrix.jdk }}
          path: '**/build/reports/tests/'
  # The packaged-host tests on Tomcat 9 (embedded) instead of Jetty 10, on Java 11 and 25; Gradle runs on Java 11
  tomcat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['11', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last version is the default, which runs Gradle
          java-version: |
            ${{ matrix.jdk }}
            11
      - run: >-
          ./gradlew --no-daemon :test-host:hostTest -PtestContainer=tomcat9
          -PtestJdk=${{ matrix.jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.jdk }}_X64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-tomcat9-jdk${{ matrix.jdk }}
          path: '**/build/reports/tests/'
