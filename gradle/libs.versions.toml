[versions]
berlioz = "0.14.5"
logback = "1.5.37"
slf4j = "2.0.20"
xmlwriter = "1.1.1"
glassfish-json = "1.1.4"
junit-jupiter = "5.14.4"   # JUnit 6 requires Java 17
jetty = "10.0.26"
servlet-api = "4.0.1"
saxon = "12.10"   # Saxon 13 requires Java 17
ehcache = "2.11.1.3.11"
ehcache-baseline = "2.6.11"   # compile baseline of the EHCache 2 adapter (ehcache-core up to 2.6)
ehcache-later = "2.10.9.2"
jcache = "1.1.1"
ehcache3 = "3.10.9"
caffeine = "3.1.8"   # 3.2 is the latest for Java 11 too; 3.1.8 is the last 3.1
versions-plugin = "0.66.0"
gretty = "3.1.9"
cyclonedx = "3.5.1"
jspecify = "1.0.1"

[libraries]
slf4j-api              = { module = "org.slf4j:slf4j-api",                                  version.ref = "slf4j" }
berlioz                = { module = "org.pageseeder.berlioz:pso-berlioz",                   version.ref = "berlioz" }
berlioz-kickstart      = { module = "org.pageseeder.berlioz:pso-berlioz-kickstart",         version.ref = "berlioz" }
xmlwriter              = { module = "org.pageseeder.xmlwriter:pso-xmlwriter",               version.ref = "xmlwriter" }
glassfish-json         = { module = "org.glassfish:javax.json",                             version.ref = "glassfish-json" }
junit-bom              = { module = "org.junit:junit-bom",                                  version.ref = "junit-jupiter" }
junit-jupiter          = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jetty-webapp           = { module = "org.eclipse.jetty:jetty-webapp",                       version.ref = "jetty" }
jetty-slf4j-impl       = { module = "org.eclipse.jetty:jetty-slf4j-impl",                   version.ref = "jetty" }
jetty-plus             = { module = "org.eclipse.jetty:jetty-plus",                         version.ref = "jetty" }
servlet-api            = { module = "javax.servlet:javax.servlet-api",                      version.ref = "servlet-api" }
saxon-he               = { module = "net.sf.saxon:Saxon-HE",                               version.ref = "saxon" }
logback-core           = { module = "ch.qos.logback:logback-core",                         version.ref = "logback" }
logback-classic        = { module = "ch.qos.logback:logback-classic",                      version.ref = "logback" }
ehcache                = { module = "net.sf.ehcache:ehcache",                              version.ref = "ehcache" }
ehcache-baseline       = { module = "net.sf.ehcache:ehcache-core",                         version.ref = "ehcache-baseline" }
ehcache-later          = { module = "net.sf.ehcache:ehcache",                              version.ref = "ehcache-later" }
jcache-api             = { module = "javax.cache:cache-api",                                version.ref = "jcache" }
ehcache3               = { module = "org.ehcache:ehcache",                                  version.ref = "ehcache3" }
jspecify               = { module = "org.jspecify:jspecify",                                version.ref = "jspecify" }
caffeine               = { module = "com.github.ben-manes.caffeine:caffeine",               version.ref = "caffeine" }
caffeine-jcache        = { module = "com.github.ben-manes.caffeine:jcache",                 version.ref = "caffeine" }

[plugins]
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }
gretty   = { id = "org.gretty",                    version.ref = "gretty" }
cyclonedx = { id = "org.cyclonedx.bom",            version.ref = "cyclonedx" }
